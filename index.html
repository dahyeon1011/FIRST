.board{position:absolute;left:4.04%;top:32.11%;width:92.67%;height:66.45%;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(12,1fr)}
.c{border:0;padding:0;background:none;cursor:pointer;perspective:400px;font:inherit}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.c.open .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden}
.b{transform:rotateY(180deg);margin:2%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fff0f6;border:2px solid #ff7fae;border-radius:8px;font-size:clamp(8px,2.4vw,13px);line-height:1.15}
.b.r1{background:#ffd54f}.b.r2{background:#ffab91}.b.r3{background:#b9f6ca}.b.r4{background:#b3e5fc}.b.ov{background:#37474f;color:#fff}
.btn{font:inherit;padding:6px 14px;border-radius:6px;border:3px solid #c2185b;background:#ff7fae;color:#fff;cursor:pointer}
.btn.g{background:#fff;color:#c2185b}
#toast{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:auto;width:fit-content;max-width:92%;background:#fff;border:4px solid #c2185b;font-size:22px;padding:10px 22px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
.ov.on{display:flex}
.panel{background:#fff;border:5px solid #c2185b;border-radius:12px;padding:18px;width:min(92%,360px);font-size:18px}
.panel h2{margin:0 0 10px}.panel .row{margin:10px 0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.panel input{font:inherit;width:100%;padding:8px;border:3px solid #ff7fae;border-radius:6px;text-align:center}
#go{background:rgba(0,0,0,.75);color:#fff;font-size:44px;flex-direction:column;gap:10px}
</style></head><body>
<div class="hud"><span id="lives"></span><span>💰 크레딧 <b id="cr">0</b></span><button class="btn g" id="adminBtn">🔒</button></div>
<div class="poster"><div class="board" id="board"></div></div>
<div id="toast"></div>
<div class="ov" id="go"><div>💀 GAME OVER 💀</div><div style="font-size:18px">관리자가 리셋할 때까지 열 수 없어요</div></div>
<div class="ov" id="login"><div class="panel"><h2>관리자 로그인</h2><input id="pin" type="password" inputmode="numeric" placeholder="비밀번호"><div class="row"><button class="btn" id="loginOk">확인</button><button class="btn g" data-close>닫기</button></div></div></div>
<div class="ov" id="admin"><div class="panel"><h2>관리자 창</h2>
<div>크레딧: <b id="cr2">0</b> · 생명: <b id="lv2">5</b> · 오픈: <b id="op2">0</b>/120</div>
<div class="row"><button class="btn" data-add="1">+1</button><button class="btn" data-add="5">+5</button><button class="btn" data-add="10">+10</button><button class="btn g" data-add="-1">-1</button></div>
<div class="row"><input id="crIn" type="number" min="0" placeholder="크레딧 직접 입력" style="width:60%"><button class="btn" id="crSet">설정</button></div>
<div class="row"><button class="btn" id="reset" style="background:#c2185b">🔄 판 리셋</button></div>
<div style="font-size:13px;font-weight:400">리셋: 모든 칸 다시 섞고 생명 5개 복구 (크레딧은 유지)</div>
<div class="row"><button class="btn g" data-close>닫기</button></div></div></div>
<script>
// ★ 설정 ★
const ADMIN_PIN="8520", LIVES=5, N=120;
const PRIZES=[{k:"r1",t:"1등",n:"오빠가 원하는 거 말해봐",c:1},{k:"r2",t:"2등",n:"생일선물",c:2},{k:"r3",t:"3등",n:"생일편지",c:5},{k:"r4",t:"4등",n:"생일 케이크",c:7},{k:"ov",t:"💀",n:"게임오버",c:5}];
const BUST={k:"",t:"💨",n:"뿡"};
const KEY="oppabbong_v1";
let S;
const $=id=>document.getElementById(id);
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fresh(keepCr){
 const pool=[];PRIZES.forEach((p,i)=>{for(let j=0;j<p.c;j++)pool.push(i)});
 while(pool.length<N)pool.push(-1);
 for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 S={credits:keepCr?S.credits:0,lives:LIVES,layout:pool,opened:[],over:false};save();
}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2000)}
function hud(){
 $('lives').textContent="❤️".repeat(S.lives)+"🖤".repeat(LIVES-S.lives);
 $('cr').textContent=$('cr2').textContent=S.credits;$('lv2').textContent=S.lives;$('op2').textContent=S.opened.length;
 $('go').classList.toggle('on',S.over);
}
function draw(){
 const b=$('board');b.innerHTML='';
 S.layout.forEach((pi,i)=>{
  const p=pi<0?BUST:PRIZES[pi],c=document.createElement('button');
  c.className='c'+(S.opened.includes(i)?' open':'');
  c.innerHTML=`<div class="in"><div class="f"></div><div class="b ${p.k}"><span>${p.t}</span><span>${p.n}</span></div></div>`;
  c.onclick=()=>pick(i,c,p);b.appendChild(c);
 });hud();
}
function pick(i,c,p){
 if(S.over)return hud();
 if(S.opened.includes(i))return toast("이미 뽑은 칸이에요");
 if(S.credits<=0)return toast("크레딧이 없어요! 💰 관리자에게 받아요");
 S.credits--;S.opened.push(i);c.classList.add('open');
 if(p.k==="ov"){S.lives--;toast("💀 게임오버 칸! 생명 -1");if(S.lives<=0){S.over=true;setTimeout(hud,700)}}
 else toast(p.k==="r1"||p.k==="r2"||p.k==="r3"||p.k==="r4"?`${p.t} : ${p.n} 🎉`:"뿡~ 💨");
 save();hud();
}
function show(id,on){$(id).classList.toggle('on',on)}
$('adminBtn').onclick=()=>{$('pin').value='';show('login',true)};
$('loginOk').onclick=()=>{if($('pin').value===ADMIN_PIN){show('login',false);show('admin',true);hud()}else toast("비밀번호가 틀려요")};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{show('login',false);show('admin',false)});
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{S.credits=Math.max(0,S.credits+ +b.dataset.add);save();hud()});
$('crSet').onclick=()=>{const v=parseInt($('crIn').value);if(v>=0){S.credits=v;save();hud()}};
let rt;$('reset').onclick=()=>{const b=$('reset');
 if(b.dataset.arm){clearTimeout(rt);delete b.dataset.arm;b.textContent="🔄 판 리셋";fresh(true);draw();show('admin',false);toast("리셋 완료");return}
 b.dataset.arm=1;b.textContent="정말 리셋? 한 번 더 누르세요";rt=setTimeout(()=>{delete b.dataset.arm;b.textContent="🔄 판 리셋"},3000)};
load();if(!S||!S.layout||S.layout.length!==N)fresh(false);draw();
</script></body></html>
